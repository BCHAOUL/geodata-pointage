<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GéoData Consulting — Pointage</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
      color: #222;
    }

    h2 { color: #14532d; }

    select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      background: #15803d;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #reader { margin-top: 16px; }

    #message {
      margin-top: 16px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 6px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    #compteur {
      margin-top: 12px;
      padding: 16px;
      background: #dcfce7;
      border-radius: 6px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <h2>GéoData Consulting</h2>
  <h3>Pointage des participants</h3>

  <label for="journee">Journée de formation :</label>
  <select id="journee">
    <option value="">Chargement des journées...</option>
  </select>

  <button id="start" onclick="demarrerScan()">Démarrer le scan</button>
  <button onclick="arreterScan()">Arrêter le scan</button>

  <div id="compteur">Présences : —</div>
  <div id="reader"></div>
  <div id="message">Chargement...</div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby-S79UxyYCXd6NmJXhK7QmPsC4RQAosYybguFXuKoMpPirMChMCQi4tJ-kUdIeNBlG/exec";

    let scanner = null;
    let traitementEnCours = false;
    let dernierToken = "";
    let dernierScan = 0;

    function message(texte) {
      document.getElementById("message").textContent = texte;
    }

    // Appel JSONP à Apps Script.
    function appelerAPI(parametres) {
      return new Promise((resolve, reject) => {
        const callback = "jsonp_" +
          Date.now() + "_" +
          Math.random().toString(36).slice(2);

        const script = document.createElement("script");
        const url = new URL(URL_APPS_SCRIPT);

        url.searchParams.set("callback", callback);

        Object.entries(parametres).forEach(([cle, valeur]) => {
          url.searchParams.set(cle, valeur);
        });

        const timeout = setTimeout(() => {
          nettoyer();
          reject(new Error("Délai dépassé. Vérifie la connexion."));
        }, 15000);

        function nettoyer() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = resultat => {
          nettoyer();
          resolve(resultat);
        };

        script.onerror = () => {
          nettoyer();
          reject(new Error("Impossible de contacter Apps Script."));
        };

        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    async function chargerJournees() {
      const select = document.getElementById("journee");

      try {
        const resultat = await appelerAPI({ action: "journees" });

        select.innerHTML = "";

        if (!Array.isArray(resultat) || resultat.length === 0) {
          select.add(new Option("Aucune journée disponible", ""));
          message("Aucune journée ouverte n'a été trouvée.");
          return;
        }

        select.add(new Option("Choisir une journée", ""));

        resultat.forEach(j => {
          select.add(new Option(j.label, j.id));
        });

        message("Journées chargées. Sélectionne une journée pour commencer.");
      } catch (e) {
        select.innerHTML = "";
        select.add(new Option("Erreur de chargement", ""));
        message("Erreur : " + e.message);
      }
    }

    async function demarrerScan() {
      const journee = document.getElementById("journee").value;

      if (!journee) {
        message("Sélectionne d'abord une journée.");
        return;
      }

      if (scanner) {
        message("Le scanner est déjà actif.");
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        message("Le module du scanner n'a pas pu être chargé.");
        return;
      }

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async token => {
            const maintenant = Date.now();

            if (traitementEnCours) return;
            if (token === dernierToken && maintenant - dernierScan < 4000) return;

            traitementEnCours = true;
            dernierToken = token;
            dernierScan = maintenant;

            try {
              message("QR détecté. Enregistrement en cours...");

              const resultat = await appelerAPI({
                action: "pointage",
                token: token,
                journee: journee
              });

              message(resultat.message || "Réponse reçue.");

              // Le compteur sera actualisé une fois que l'API
              // de statistiques aura été mise en place.
            } catch (e) {
              message("Erreur : " + e.message);
            } finally {
              traitementEnCours = false;
            }
          }
        );

        message("Caméra activée. Présente un QR code devant l'objectif.");
      } catch (e) {
        scanner = null;
        message("Impossible d'ouvrir la caméra. Vérifie les autorisations.");
      }
    }

    async function arreterScan() {
      if (!scanner) {
        message("Le scanner n'est pas actif.");
        return;
      }

      try {
        await scanner.stop();
        scanner.clear();
      } catch (e) {
        // Le scanner est peut-être déjà arrêté.
      }

      scanner = null;
      traitementEnCours = false;
      message("Scanner arrêté.");
    }

    chargerJournees();
  </script>
</body>
</html>
